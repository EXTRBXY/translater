name: Model manifest

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Hugging Face repos, space separated"
        required: true

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Resolve
        env:
          REPOS: ${{ inputs.repos }}
        run: python tools/hf_manifest.py $REPOS | tee manifest.json

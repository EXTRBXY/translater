name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata as m; print(m.version('translater'))"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Тег $env:GITHUB_REF_NAME не совпадает с версией v$version в pyproject.toml"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Translater --icon assets/translater.ico src/translater/__main__.py

      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = "Translater-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path dist/Translater -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.zip }}"
          --title "Translater ${{ steps.version.outputs.version }}"
          --notes "Распакуйте архив и запустите Translater.exe."

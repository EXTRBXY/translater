name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest -q

      - name: Version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata as m; print(m.version('translater'))"
          gh release view "v$version" *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          $global:LASTEXITCODE = 0
          "version=$version" >> $env:GITHUB_OUTPUT
          "exists=$exists" >> $env:GITHUB_OUTPUT

      - name: Build exe
        if: steps.version.outputs.exists == 'false'
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name Translater --icon assets/translater.ico src/translater/__main__.py

      - name: Package
        if: steps.version.outputs.exists == 'false'
        id: package
        shell: pwsh
        run: |
          $zip = "Translater-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path dist/Translater -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        run: >
          gh release create "v${{ steps.version.outputs.version }}" "${{ steps.package.outputs.zip }}"
          --target "${{ github.sha }}"
          --title "Translater ${{ steps.version.outputs.version }}"
          --notes "Распакуйте архив и запустите Translater.exe."

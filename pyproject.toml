[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "translater"
version = "0.1.0"
description = "Локальный переводчик голосового чата для игр (Windows)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.11.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[project.gui-scripts]
translater = "translater.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "translater"
version = "0.2.0"
description = "Локальный переводчик голосового чата для игр (Windows)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6==6.11.2",
    "numpy==2.5.4",
    "psutil==7.2.2",
    "comtypes==1.4.17",
    "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'",
    "av==19.0.1",
    "onnxruntime==1.31.0",
    "ctranslate2==4.8.3",
    "faster-whisper==1.2.1",
    "huggingface-hub==2.2.0",
    "tokenizers==0.23.3",
    "sentencepiece==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
]

[project.gui-scripts]
translater = "translater.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
